# 1. Definimos dos destinos: console y file
log4j.rootCategory=WARN, console, file

# 2. Configuración de CONSOLA (la que ya tienes)
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss} %p %c{1}: %m%n

# 3. Configuración de ARCHIVO (El "Guardado")
log4j.appender.file=org.apache.log4j.FileAppender
log4j.appender.file.File=logs/ejecucion_spark.log
log4j.appender.file.append=true
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p] %c{1}: %m%n
